<div class="bg-white rounded shadow p-6 w-full max-w-xl">
  <h2 class="text-xl font-bold">Contact</h2>
  <form class="mt-4 space-y-3" hx-post="/partials/send-contact.html" hx-swap="outerHTML">
    <label class="block">
      <span class="text-sm text-gray-700">Email</span>
      <input name="email" type="email" required class="mt-1 block w-full border rounded p-2" />
    </label>
    <label class="block">
      <span class="text-sm text-gray-700">Message</span>
      <textarea name="message" required class="mt-1 block w-full border rounded p-2"></textarea>
    </label>
    <div class="flex items-center gap-3">
      <button class="bg-indigo-600 text-white px-4 py-2 rounded">Send</button>
      <button type="button" data-close-modal class="text-sm text-gray-600">Cancel</button>
    </div>
  </form>
</div>
