<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Keshav — Portfolio</title>
    <link rel="stylesheet" href="/src/main.css" />
    <!-- HTMX (served locally) -->
    <script src="/node_modules/htmx.org/dist/htmx.min.js"></script>
    <script src="/js/theme.js" defer></script>
    <meta name="description" content="Keshav's portfolio built with HTMX" />
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased body">

    <!-- Sidebar -->
    <div hx-get="/src/components/sidebar/sidebar.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <!-- Content Section -->
    <div id="content" class="p-6">
      <div id="welcome-message">
        <h2 class="text-2xl font-bold mb-4">Welcome</h2>
        <p>Select a section from the sidebar to view its content.</p>
      </div>
    </div>

    <!-- Modal target for HTMX swaps -->
    <div id="modal" class="fixed inset-0 flex items-center justify-center p-6 pointer-events-none"></div>

    <!-- Simple HTMX helper (optional) -->
    <script>
      document.body.addEventListener('htmx:afterSwap', (e) => {
        // Move modal content into place with pointer events enabled
        if (e.detail.target.id === 'modal' && document.getElementById('modal').innerHTML.trim() !== '') {
          document.getElementById('modal').classList.remove('pointer-events-none');
        }

        if (e.detail.target.id === 'sidebar') {
          const sidebarLinks = document.querySelectorAll('.sidebar nav ul li a');
          const contentDiv = document.getElementById('content');

          sidebarLinks.forEach(link => {
            link.addEventListener('click', (event) => {
              event.preventDefault();

              // Clear existing content
              contentDiv.innerHTML = '';

              // Fetch and display the selected section
              const sectionUrl = link.getAttribute('href').substring(1) + '.html';
              fetch(`/src/components/${sectionUrl}`)
                .then(response => response.text())
                .then(html => {
                  contentDiv.innerHTML = html;
                })
                .catch(error => {
                  console.error('Error loading section:', error);
                });
            });
          });
        }
      });

      document.body.addEventListener('click', (e) => {
        if (e.target.matches('[data-close-modal]')) {
          document.getElementById('modal').innerHTML = '';
          document.getElementById('modal').classList.add('pointer-events-none');
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const sidebarLinks = document.querySelectorAll('.sidebar nav ul li a');
        const contentDiv = document.getElementById('content');
        const welcomeMessage = document.getElementById('welcome-message');

        sidebarLinks.forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();

            // Clear existing content
            contentDiv.innerHTML = '';

            // Fetch and display the selected section
            const sectionUrl = link.getAttribute('href').substring(1) + '.html';
            fetch(`/src/components/${sectionUrl}`)
              .then(response => response.text())
              .then(html => {
                contentDiv.innerHTML = html;
              })
              .catch(error => {
                console.error('Error loading section:', error);
              });
          });
        });
      });
    </script>
  </body>
</html>
