    <script>
        // Function to update active navigation link
        function updateActiveNav() {
            const navLinks = document.querySelectorAll('.nav-link');
            const currentSection = sessionStorage.getItem('activeSection') || 'skills';
            
            navLinks.forEach(link => {
                const section = link.getAttribute('data-section');
                if (section === currentSection) {
                    link.classList.add('active', 'bg-blue-600/20', 'text-white', 'border-l-4', 'border-blue-500');
                    link.classList.remove('text-gray-300');
                } else {
                    link.classList.remove('active', 'bg-blue-600/20', 'text-white', 'border-l-4', 'border-blue-500');
                    link.classList.add('text-gray-300');
                }
            });
        }

        // Set active section when nav link is clicked
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                const section = this.getAttribute('data-section');
                sessionStorage.setItem('activeSection', section);
                updateActiveNav();
            });
        });

        // Update active nav on HTMX swap
        document.body.addEventListener('htmx:afterSwap', function(e) {
            // Try to determine section from the loaded content
            const content = e.detail.target;
            if (content.id === 'content') {
                const skillsSection = content.querySelector('#skills');
                const projectsSection = content.querySelector('#projects');
                const experienceSection = content.querySelector('#experience');
                const educationSection = content.querySelector('#education');
                
                if (skillsSection) {
                    sessionStorage.setItem('activeSection', 'skills');
                } else if (projectsSection) {
                    sessionStorage.setItem('activeSection', 'projects');
                } else if (experienceSection) {
                    sessionStorage.setItem('activeSection', 'experience');
                } else if (educationSection) {
                    sessionStorage.setItem('activeSection', 'education');
                }
                updateActiveNav();
            }
        });

        // Initialize on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateActiveNav);
        } else {
            updateActiveNav();
        }
    </script>
